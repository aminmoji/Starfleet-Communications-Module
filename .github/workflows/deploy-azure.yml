name: Deploy Starfleet to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starfleet-azure-production
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: LCARS-CHAT-APP
  AZURE_WEBAPP_PACKAGE_PATH: .
  NODE_VERSION: 20.x

jobs:
  build-and-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_75D194887320406AAE7014FDBB6B6059 }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
